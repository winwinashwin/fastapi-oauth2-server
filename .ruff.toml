line-length = 120
output-format = "grouped"
target-version = "py311"

[lint]
ignore = [
    "A002",    # builtin used as an argument
    "A003",    # builtin used as a class attribute
    "COM812",  # Do not force trailing commas
    "E731",    # Allow assigning lambda functions to variables
    "N804",    # first argument of a classmethod should be named 'cls'
    "N805",    # first argument of a method should be named 'self'
    "N812",    # Allow importing with upper case (used in `from pyspark.sql import types as T`)
    "N818",    # error suffix should be present in exception names
    "PLR091",  # Do not add restrain number of statements in functions and methods
    "PLR2004", # Allow numerical constants in comparisons
    "B904",    # Don't force raise ... from None in except clause
    "E721",    # Allow type comparisons with `is` instead of `isinstance()`
    "TRY003",  # Allow raising exceptions with strings. It is recommended to create separate classes for this
    "ANN002",  # Skip typing for *args as they are hard to type
    "ANN003",  # Skip typing for **kwargs as they are hard to type
]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "E",      # pycodestyle - errors
    "EXE",    # flake8-executable
    "F",      # pyflakes
    "FAST",   # fastapi
    "FBT",    # flake8-boolean-trap
    "FLY",    # flynt
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "NPY",    # numpy-specific rules
    "PD",     # pandas-vet
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PLC",    # pylint-convention
    "PLE",    # pylint-error
    "PLR",    # pylint-refactor
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI024", # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff specific rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle - warnings
    "YTT",    # flake8-2020
]


[lint.isort]
combine-as-imports = true
order-by-type = false
lines-after-imports = 2
case-sensitive = true

[lint.flake8-import-conventions.extend-aliases]
"typing" = "t"

[lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "__future__.annotations is discouraged. See PEP-649 and PEP-749"

[lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
