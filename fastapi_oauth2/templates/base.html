<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}OAuth Server{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
      a {
        color: #315edb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .shell {
        width: min(100% - 2rem, 880px);
        margin: 0 auto;
      }
      .site-header {
        padding: 1.25rem 0;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: #172033;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .brand:hover {
        text-decoration: none;
      }
      .brand-mark {
        display: grid;
        width: 2rem;
        height: 2rem;
        place-items: center;
        border-radius: 0.65rem;
        color: white;
        background: linear-gradient(135deg, #315edb, #7648d6);
        font-size: 0.95rem;
      }
      main {
        padding: 1.5rem 0 3rem;
      }
      .card {
        padding: clamp(1.25rem, 4vw, 2.25rem);
        border: 1px solid #dfe5ef;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 12px 32px rgb(23 32 51 / 7%);
      }
      .card + .card {
        margin-top: 1rem;
      }
      .eyebrow {
        margin: 0 0 0.5rem;
        color: #596579;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1,
      h2,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 0.65rem;
        font-size: clamp(1.6rem, 4vw, 2.25rem);
        letter-spacing: -0.04em;
      }
      h2 {
        margin-bottom: 0.65rem;
        font-size: 1.05rem;
      }
      .muted {
        color: #66738a;
        line-height: 1.55;
      }
      .form-grid {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .field {
        display: grid;
        gap: 0.4rem;
      }
      .field label,
      .field-label {
        font-size: 0.9rem;
        font-weight: 650;
      }
      .hint {
        color: #718097;
        font-size: 0.8rem;
        line-height: 1.4;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        padding: 0.72rem 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.55rem;
        color: inherit;
        background: white;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid rgb(49 94 219 / 18%);
        border-color: #315edb;
      }
      textarea {
        min-height: 5rem;
        resize: vertical;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem;
        margin-top: 1.5rem;
      }
      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 2.7rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.55rem;
        color: white;
        background: #315edb;
        cursor: pointer;
        font-weight: 700;
      }
      .button:hover {
        background: #254cb7;
        text-decoration: none;
      }
      .button-secondary {
        color: #26354e;
        background: #e9eef8;
      }
      .button-secondary:hover {
        background: #dce5f4;
      }
      .notice {
        display: flex;
        gap: 0.75rem;
        padding: 1rem;
        border: 1px solid #d9e2ff;
        border-radius: 0.7rem;
        background: #f3f6ff;
        color: #33456b;
      }
      .client-list {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .client-card {
        padding: 1.1rem;
        border: 1px solid #e3e8f1;
        border-radius: 0.75rem;
        background: #fbfcfe;
      }
      .client-card h2 {
        margin-bottom: 0.9rem;
      }
      .details {
        display: grid;
        grid-template-columns: minmax(8rem, auto) 1fr;
        gap: 0.55rem 0.9rem;
        margin: 0;
        font-size: 0.9rem;
      }
      .details dt {
        color: #66738a;
        font-weight: 650;
      }
      .details dd {
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .scope {
        display: inline-block;
        padding: 0.2rem 0.45rem;
        border-radius: 0.35rem;
        background: #e9eef8;
        color: #40516e;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
      }
      .consent {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 0.7rem;
        padding: 1rem;
        border: 1px solid #dfe5ef;
        border-radius: 0.7rem;
        background: #fbfcfe;
      }
      .check input {
        margin-top: 0.2rem;
        accent-color: #315edb;
      }
      @media (max-width: 560px) {
        .details {
          grid-template-columns: 1fr;
          gap: 0.15rem;
        }
        .details dd {
          margin-bottom: 0.55rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="{{ url_for('home') }}">
          <span class="brand-mark" aria-hidden="true">O</span>
          <span>OAuth Server</span>
        </a>
      </div>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
